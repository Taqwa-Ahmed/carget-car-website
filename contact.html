<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fa-solid fa-gauge"></i>
            <h3 style="font-style:italic;"><strong>CarGET</strong></h3>
        </div>
        <h1>Contact Us</h1>
        <form >
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="name" >

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"placeholder="Phone Number"  required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city"placeholder="city"  required>

            <label for="request">Main Request:</label>
            <textarea id="request" name="request" rows="4" required></textarea>

            <label for="department">Department:</label>
            <select id="department" name="department" >
                <option value="sales">Sales</option>
                <option value="support">Support</option>
                </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit">Send</button>
        </form>

        <div class="contact-info">
            <h2>Contact Information</h2>
            <p>Address: Al-Nissim Workshop for Cars - Riyadh</p>
            <p>Phone: +966 123 456 789</p>
            <p>Email: info@CarGET.com</p>
        </div>
    </div>

    <!-- <script src="script.js"></script> -->
</body>
</html>
